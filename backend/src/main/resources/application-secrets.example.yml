# ============================================
# 私密配置文件模板
# 使用方法：
# 1. 复制此文件为 application-secrets.yml
#    cp application-secrets.example.yml application-secrets.yml
# 2. 填入你的真实配置
# 3. application-secrets.yml 已在 .gitignore 中，不会被提交
# ============================================
spring:
  datasource:
    password: 你的数据库密码

app:
  # 阿里云百炼 API Key（在线模式需要）
  # 获取地址: https://dashscope.aliyun.com/
  dashscope:
    api-key: sk-你的阿里云API密钥

  # JWT 签名密钥（生产环境请换随机字符串）
  jwt:
    secret: 你的JWT密钥至少256位

  # 管理员密码（可选，默认 123456）
  admin:
    password: 123456
