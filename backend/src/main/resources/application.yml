server:
  port: 8080

spring:
  application:
    name: ragkb

  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

  # 导入本地私密配置（不提交到 Git）
  config:
    import: optional:classpath:application-secrets.yml

  datasource:
    url: jdbc:postgresql://localhost:5432/ragkb
    username: ${DB_USERNAME:ragkb}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5-coder:7b
        options:
          temperature: 0.3
          num-predict: 1024
      embedding:
        model: nomic-embed-text:latest

# ============================================
# 应用自定义配置
# ============================================
app:
  # AI 模式：offline（Ollama 本地）/ online（阿里云百炼）
  ai-mode: offline
  # AI 框架：spring-ai（Spring AI）/ langchain4j（LangChain4j），可在前端切换
  ai-framework: spring-ai

  # 阿里云百炼 DashScope 在线 API 配置
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    chat-model: qwen-plus
    embedding-model: text-embedding-v2

  # 文档自动加工：上传后是否调用大模型生成摘要 + 提取关键词标签
  ai:
    auto-enrich: true

  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration: 1800000
    refresh-token-expiration: 604800000

  rag:
    chunk-size: 500
    chunk-overlap: 100
    top-k: 5
    similarity-threshold: 0.5
    max-history-rounds: 3
    # 混合检索：向量语义 + 关键词全文，RRF 融合（true 时启用）
    hybrid-enabled: true
    # RRF 融合常数 k（默认 60）
    rrf-k: 60
    # 查询改写：检索前用 LLM 优化查询（true 时启用，失败自动降级为原问题）
    query-rewrite-enabled: true

  storage:
    upload-dir: ./data/documents

  admin:
    username: admin
    password: ${ADMIN_PASSWORD:123456}
